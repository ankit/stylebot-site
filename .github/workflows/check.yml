name: check
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Use cached node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: siteNodeModules-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            siteNodeModules-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Type check, translations against English, and extension wording.
      - name: Check
        run: yarn run check

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Build
        run: npx astro build

      - name: Build the gallery
        run: yarn build:gallery
